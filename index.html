<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I wanted to tell you something</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #ffd6e8, #ffb3d1 50%, #ff8fb8);
    color: #5a1033;
    overflow-x: hidden;
  }
  body.plain { background: linear-gradient(135deg, #f5f3ef, #e4e1da); color: #333; }
  body.plain .hearts { display: none; }
  .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .heart {
    position: absolute; bottom: -40px;
    animation: floatUp linear infinite;
    opacity: .7;
  }
  @keyframes floatUp {
    to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }
  .page {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 30px 18px; text-align: center;
  }
  .page.active { display: flex; animation: fadeIn .9s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; transform: none; } }

  h1.intro { font-family: Georgia, serif; font-size: clamp(1.8rem, 6vw, 2.8rem); margin-bottom: 22px; }

  /* Photo frame */
  .frame {
    position: relative;
    width: 260px; height: 330px;
    padding: 14px;
    background: linear-gradient(145deg, #fff6d6, #e0b44c 45%, #fff2b8 70%, #c9962b);
    border-radius: 14px;
    box-shadow: 0 12px 35px rgba(120, 20, 60, .35);
    margin-bottom: 26px;
    transition: transform .3s;
  }
  .frame:hover { transform: rotate(-1.5deg) scale(1.02); }
  .frame-inner {
    width: 100%; height: 100%;
    background: #fff0f6;
    border: 3px solid #fff;
    border-radius: 6px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    color: #b0527a; font-size: .95rem;
  }
  .frame-inner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame .corner { position: absolute; font-size: 1.5rem; }
  .c1 { top: -12px; left: -10px; } .c2 { top: -12px; right: -10px; }
  .c3 { bottom: -12px; left: -10px; } .c4 { bottom: -12px; right: -10px; }
  .hint { font-size: .8rem; margin-top: -14px; margin-bottom: 18px; opacity: .7; }

  button {
    font-family: inherit; cursor: pointer; border: none;
    border-radius: 50px; color: #fff; transition: all .3s ease;
  }
  .plain .main-btn { background: #333; box-shadow: 0 8px 20px rgba(0,0,0,.25); animation: none; }
  .plain .frame-inner { background: #eee; }
  .plain .frame { box-shadow: 0 12px 35px rgba(0,0,0,.3); }
  .main-btn {
    background: linear-gradient(135deg, #ff4d8d, #e0245e);
    font-size: 1.15rem; padding: 14px 38px;
    box-shadow: 0 8px 20px rgba(224, 36, 94, .45);
    animation: pulse 1.6s infinite;
  }
  .main-btn:hover { transform: scale(1.08); }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  /* Page 2 */
  .card {
    background: rgba(255, 255, 255, .8);
    backdrop-filter: blur(6px);
    border-radius: 24px;
    padding: 34px 26px;
    max-width: 640px; width: 100%;
    box-shadow: 0 15px 40px rgba(120, 20, 60, .3);
  }
  .love {
    font-family: Georgia, serif;
    font-size: clamp(2.4rem, 9vw, 4rem);
    color: #e0245e;
    margin-bottom: 8px;
    animation: beat 1.3s infinite;
  }
  @keyframes beat { 50% { transform: scale(1.08); } }
  .mini-photo {
    width: 110px; height: 110px; border-radius: 50%;
    border: 4px solid #e0b44c; object-fit: cover;
    margin: 6px auto 16px; display: none;
    box-shadow: 0 6px 16px rgba(0,0,0,.25);
  }
  .desc { line-height: 1.85; font-size: 1.02rem; text-align: left; margin: 14px 0 22px; }
  .question { font-size: 1.5rem; font-weight: 700; margin-bottom: 18px; color: #c01550; }
  .options { display: flex; gap: 18px; justify-content: center; align-items: center; min-height: 70px; }
  .yes { background: linear-gradient(135deg, #2ecc71, #1fa357); font-size: 1.2rem; padding: 14px 40px; box-shadow: 0 6px 16px rgba(31,163,87,.4); }
  .yes:hover { transform: scale(1.1); }
  .no { background: #8e8e93; font-size: 1.05rem; padding: 12px 30px; }
  .msg { margin-top: 18px; font-size: 1.15rem; font-weight: 600; color: #b3124a; min-height: 30px; animation: fadeIn .6s; }

  /* Page 3 */
  .big { font-family: Georgia, serif; font-size: clamp(2rem, 8vw, 3.4rem); color: #e0245e; margin: 10px 0 14px; }
  .sub { font-size: 1.2rem; max-width: 460px; line-height: 1.7; }
  .emoji-big { font-size: 5rem; animation: beat 1s infinite; }
  .couple { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 28px; flex-wrap: nowrap; }
  .pframe {
    width: 140px; height: 190px; padding: 7px;
    background: linear-gradient(145deg, #fff6d6, #e0b44c 45%, #fff2b8 70%, #c9962b);
    border-radius: 12px; box-shadow: 0 10px 28px rgba(120,20,60,.4);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: pointer; color: #b0527a; font-size: .8rem; text-align: center;
  }
  .pframe img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; display: block; }
  .pframe span { background: #fff0f6; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
  .mid-heart { font-size: 3rem; animation: beat 1s infinite; filter: drop-shadow(0 4px 8px rgba(224,36,94,.5)); }
  @media (min-width: 500px) { .pframe { width: 190px; height: 250px; } .mid-heart { font-size: 4rem; } .couple { gap: 18px; } }
  .person { display: flex; flex-direction: column; align-items: center; }
  .pname { margin-top: 10px; font-family: Georgia, serif; font-size: 1.2rem; font-weight: 700; color: #c01550; }
  .names { font-family: Georgia, serif; font-size: 1.3rem; color: #b3124a; margin-bottom: 10px; }
  .confetti { position: fixed; top: -30px; z-index: 5; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
</style>
</head>
<body class="plain">

<div class="hearts" id="hearts"></div>

<!-- PAGE 1 -->
<section class="page active" id="page1">
  <h1 class="intro">I wanted to tell you something...</h1>


  <button class="main-btn" id="startBtn">Click here</button>
</section>

<!-- PAGE 2 -->
<section class="page" id="page2">
  <div class="card">
    <h1 class="love">I Like You ❤️</h1>

    <p class="desc" id="desc"></p>

    <p class="question">Will you accept my proposal? 💍</p>

    <div class="options">
      <button class="yes" id="yesBtn">Yes 💕</button>
      <button class="no" id="noBtn">No</button>
    </div>
    <p class="msg" id="msg"></p>
  </div>
</section>

<!-- PAGE 3 -->
<section class="page" id="page3">
  <h1 class="big">We are in a relationship now 💑</h1>
  <p class="names" id="bothNames"></p>
  <p class="sub">Thank you for making me the happiest person in the world. I promise to always cherish you, support you, and make you smile. ❤️</p>

  <div class="couple">
    <div class="person"><div class="pframe"><img id="herFinal" alt="Pratiksha"></div><p class="pname" id="herName"></p></div>
    <div class="mid-heart">❤️</div>
    <div class="person"><div class="pframe" id="myBox" title="Click to set your photo">
      <img id="myPhoto" alt="Me" style="display:none">
      <span id="myPlaceholder">Click to add<br>your photo</span>
    </div><p class="pname" id="myName"></p></div>
  </div>
  <input type="file" id="myInput" accept="image/*" hidden>
</section>

    h.style.animationDelay = -Math.random() * 12 + "s";
    heartsBox.appendChild(h);
  }

  function showPhoto(src) {
    $("herFinal").src = src;
    photoData = src;
  }
  // Load her photo
  if (HER_PHOTO) {
    const t = new Image();
    t.onload = () => showPhoto(HER_PHOTO);
    t.src = HER_PHOTO;
  }
  // Load my photo for the last page
  function setMyPhoto(src) { $("myPhoto").src = src; $("myPhoto").style.display = "block"; $("myPlaceholder").style.display = "none"; }
  if (MY_PHOTO) {
    const m = new Image();
    m.onload = () => setMyPhoto(MY_PHOTO);
    m.src = MY_PHOTO;
  }
  $("myBox").addEventListener("click", () => $("myInput").click());
  $("myInput").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => setMyPhoto(ev.target.result);
    r.readAsDataURL(f);
  });


  function go(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    $(id).classList.add("active");
    document.body.classList.toggle("plain", id === "page1");
    window.scrollTo(0, 0);
  }

  $("herName").textContent = HER_NAME;
  $("myName").textContent = MY_NAME;
  $("bothNames").textContent = HER_NAME + " & " + MY_NAME;
  $("desc").textContent = (HER_NAME ? HER_NAME + ", " : "") + DESCRIPTION;

  $("startBtn").addEventListener("click", () => go("page2"));

  // NO button logic
  let noCount = 0;
  const noBtn = $("noBtn"), msg = $("msg");

  noBtn.addEventListener("click", () => {
    noCount++;
    if (noCount === 1) {
      msg.textContent = "I really like you. Please accept. 🥺";
      noBtn.style.fontSize = "0.8rem";
      noBtn.style.padding = "7px 16px";
    } else if (noCount === 2) {
      msg.textContent = "I am so lonely without you, please accept. 😢";
      noBtn.style.fontSize = "0.6rem";
      noBtn.style.padding = "4px 10px";
    } else {
      msg.textContent = "Ab toh no ka option hi nahi raha 😎💕";
      noBtn.style.display = "none";
    }
  });

  // YES button
  $("yesBtn").addEventListener("click", () => {
    go("page3");
    for (let i = 0; i < 70; i++) {
      setTimeout(() => {
        const c = document.createElement("span");
        c.className = "confetti";
        c.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        c.style.left = Math.random() * 100 + "vw";
        c.style.fontSize = 18 + Math.random() * 26 + "px";
        c.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5500);
      }, i * 60);
    }
  });
</script>
</body>
</html>
